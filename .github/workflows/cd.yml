name: Evaluation Service CD

on:
  workflow_run:
    workflows: ["Evaluation Service CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: fiap-tech-challenge-devops/reusable-workflows/.github/workflows/cd.yml@v2.2.0
    with:
      service-name: evaluation-service
      image-repository: 762103020993.dkr.ecr.us-east-1.amazonaws.com/togglemaster/evaluation-service
      image-tag: ${{ github.event.workflow_run.head_sha }}
      environment: prod
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
